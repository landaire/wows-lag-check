[package]
name = "wows-lag-check"
version = "0.1.0"
edition = "2024"
description = "Highlight ping spikes in World of Warships replay files"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

# Sans-io replay parser + entity-def parsing. default features = ["arc",
# "parsing"] - no filesystem VFS, so these compile for wasm32.
wows_replays = "0.35"
wowsunpack = { version = "0.34", default-features = false, features = ["parsing", "rkyv"] }

# Game params (rkyv blob) + translation catalog (.mo) for ship and camo names.
# The blob is fetched zstd-compressed and inflated with the pure-Rust ruzstd.
rkyv = "0.8"
gettext = "0.4"
ruzstd = "0.8"

# WoT replays don't go through wows_replays (different Blowfish key, different
# packet ids), so we open the body directly. Same Blowfish + zlib + winnow
# stack the WoWs parser uses, just configured per-game.
blowfish = "0.9"
cipher = "0.4"
byteorder = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# rustc emits bulk-memory ops by default since 1.82; wasm-opt needs the matching flag.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
